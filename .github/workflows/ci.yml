name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm --prefix functions ci

      # The build is part of the gate on purpose: this is the code that spends
      # money, and a type error here is only caught at deploy time otherwise.
      - name: Build and test
        run: npm --prefix functions run check
