name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm --prefix functions ci

      # The build is part of the gate on purpose: this is the code that spends
      # money, and a type error here is only caught at deploy time otherwise.
      - name: Build and test
        run: npm --prefix functions run check

  # Both clients' end-to-end suites against this branch in the demo emulators
  # (CONTRACT.md, E2E), so a change that breaks one of them is red before it merges.
  website:
    name: Website against this proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the website's main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kellygracelab-dotcom/tieryourlife-web
          ref: main
          path: web

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json
            web/functions/package-lock.json

      # The Firestore and Storage emulators are Java programs.
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Keep the emulators' downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.34.2

      - name: Install
        run: |
          npm --prefix functions ci
          npm --prefix web ci
          npm --prefix web/functions ci
          npm install --global firebase-tools@15.34.2

      - name: Install the smoke browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Smokes against this proxy
        working-directory: web
        run: npm run e2e:proxy
        env:
          TYL_PROXY_DIR: ..

      - name: Proxy sync regression scenarios
        run: npm --prefix functions run test:e2e

      - name: Keep the smoke traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-smokes
          path: web/test-results/proxy
          retention-days: 7

  app:
    name: App against this proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the app's main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kellygracelab-dotcom/TierYourLife
          ref: main
          path: app

      # Gradle and the Firestore emulator both run on it.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Keep the emulators' downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.34.2

      - name: Install
        run: |
          npm --prefix functions ci
          npm install --global firebase-tools@15.34.2

      # Built first, so the emulators are up only while the tests run.
      - name: Build the tests
        working-directory: app
        run: ./gradlew :e2e:testDebugUnitTest

      - name: End-to-end tests
        run: npm --prefix functions run emulators:e2e:exec -- "cd \"$GITHUB_WORKSPACE/app\" && ./gradlew :e2e:testDebugUnitTest -Pe2e"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-e2e-reports
          path: |
            app/e2e/build/reports/tests/**
            *-debug.log
            functions/*-debug.log
          retention-days: 7
